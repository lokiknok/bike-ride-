<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eternal Journey - Realistic Cinematic Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020202; font-family: 'Cinzel', 'Georgia', serif; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .cinematic-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.6) 85%, rgba(0,0,0,0.95) 100%),
                        linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.5) 100%);
        }
        
        .film-grain {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .story-container {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); z-index: 10;
            text-align: center; width: 80%; max-width: 800px; pointer-events: none;
        }
        .story-text {
            color: #ffffff; font-size: 1.6rem; letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0,0,0,1), 0 0 10px rgba(255,255,255,0.4);
            font-weight: 300; opacity: 0; transform: translateY(20px); transition: opacity 1.5s ease, transform 1.5s ease;
        }
        .story-text.active { opacity: 1; transform: translateY(0); }
        .sub-text { color: #e6c200; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; margin-top: 10px; opacity: 0.9; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        
        .audio-control {
            position: absolute; top: 30px; right: 30px; z-index: 10; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.4); padding: 12px 24px; color: white; letter-spacing: 1px;
            font-size: 0.85rem; cursor: pointer; border-radius: 4px; backdrop-filter: blur(10px); transition: all 0.3s;
        }
        .audio-control:hover { background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); }
        
        .cinema-bar-top { position: absolute; top: 0; left: 0; width: 100%; height: 8vh; background: #000; z-index: 9; }
        .cinema-bar-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 8vh; background: #000; z-index: 9; }
    </style>
</head>
<body>

    <div class="cinema-bar-top"></div>
    <div class="cinema-bar-bottom"></div>
    <div class="cinematic-overlay"></div>
    <div class="film-grain"></div>

    <button class="audio-control" id="audioBtn">ACTIVATE REALISTIC AUDIO & EXPERIENCE</button>

    <div class="story-container">
        <p class="story-text" id="storyText">Our journey began in the gentle embrace of the morning sun...</p>
        <div class="sub-text" id="chapterText">Chapter I: The Dawn of Us</div>
    </div>

    <canvas id="cinemaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('cinemaCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- REALISTIC AUDIO SYNTHESIS ENGINE ---
        let audioCtx = null;

        function initRealisticAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // 1. Cinematic Background Pad (Rich, deep strings/synth)
            let padOsc = audioCtx.createOscillator();
            let padOsc2 = audioCtx.createOscillator();
            let padGain = audioCtx.createGain();
            let padFilter = audioCtx.createBiquadFilter();

            padOsc.type = 'sine';
            padOsc2.type = 'triangle';
            padOsc.frequency.value = 110; // A2
            padOsc2.frequency.value = 220; // A3
            
            padFilter.type = 'lowpass';
            padFilter.frequency.value = 600;
            
            padGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            padGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 5);

            padOsc.connect(padFilter);
            padOsc2.connect(padFilter);
            padFilter.connect(padGain);
            padGain.connect(audioCtx.destination);
            padOsc.start();
            padOsc2.start();

            // 2. Realistic Motorcycle Engine Synthesizer (Combustion Cycle Simulation)
            let engineGain = audioCtx.createGain();
            engineGain.gain.value = 0.25;

            // Base engine rumble (low frequency sawtooth)
            let rumbleOsc = audioCtx.createOscillator();
            rumbleOsc.type = 'sawtooth';
            rumbleOsc.frequency.value = 45; // Deep exhaust note
            
            // Engine filter to muffle the harshness and make it sound like a real exhaust
            let engineFilter = audioCtx.createBiquadFilter();
            engineFilter.type = 'lowpass';
            engineFilter.frequency.value = 250;
            engineFilter.Q.value = 2;

            // LFO to simulate the pistons firing (the "put-put-put" rhythm)
            let pistonLFO = audioCtx.createOscillator();
            pistonLFO.type = 'sine';
            pistonLFO.frequency.value = 15; // RPM modulation speed
            
            let pistonGain = audioCtx.createGain();
            pistonGain.gain.value = 0.8; // Depth of the pulsing

            pistonLFO.connect(pistonGain.gain);
            rumbleOsc.connect(pistonGain);
            pistonGain.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(audioCtx.destination);

            rumbleOsc.start();
            pistonLFO.start();
        }

        document.getElementById('audioBtn').addEventListener('click', function() {
            initRealisticAudio();
            this.style.opacity = '0';
            setTimeout(() => this.style.display = 'none', 500);
        });

        // --- CHAPTERS & TIMELINE ---
        const STAGES = { SUNRISE: 0, TOWN: 1, FLOWER_FIELDS: 2, CELEBRATION: 3, MOUNTAINS: 4, RAINSTORM: 5, STARRY_NIGHT: 6, COSMIC: 7, FINAL_HILLTOP: 8 };

        const stageData = [
            { text: "Our journey began in the gentle embrace of the morning sun.", title: "Chapter I: The Dawn of Us", duration: 8000 },
            { text: "Through winding streets where we first locked eyes, a timeless melody sparked.", title: "Chapter II: The First Meeting", duration: 8000 },
            { text: "Chasing dreams across endless meadows blooming with absolute devotion.", title: "Chapter III: Blooming Hearts", duration: 8000 },
            { text: "The universe danced to celebrate your presence beneath thousands of glowing lights.", title: "Chapter IV: A Joyous Celebration", duration: 8000 },
            { text: "Climbing majestic heights where mist whispers our deep, eternal promise.", title: "Chapter V: Braving the Peaks", duration: 8000 },
            { text: "In the pouring rain, holding tighter, finding shelter only in each other.", title: "Chapter VI: The Storm We Share", duration: 8000 },
            { text: "Under the vast moonlit canopy, our souls resonated into the silent night.", title: "Chapter VII: Infinite Stillness", duration: 8000 },
            { text: "Floating across the cosmos, traversing galaxies carved out of pure love.", title: "Chapter VIII: Beyond Space & Time", duration: 9000 },
            { text: "Where thousands of prayers rise, our stars aligning into an eternal heart.", title: "Epilogue: Forever and Always", duration: 15000 }
        ];

        let globalTimeline = 0;
        let currentStage = 0;
        let particles = [];
        let stars = [];
        let rainDrops = [];
        
        for(let i=0; i<200; i++) stars.push({ x: Math.random() * 2500, y: Math.random() * 1200, size: Math.random() * 2 + 0.5, alpha: Math.random() });

        let bike = {
            baseX: window.innerWidth * 0.35, baseY: window.innerHeight * 0.72,
            x: window.innerWidth * 0.35, y: window.innerHeight * 0.72,
            wheelRotation: 0, bobbing: 0
        };

        const storyEl = document.getElementById('storyText');
        const chapterEl = document.getElementById('chapterText');
        
        function updateText(stageIndex) {
            if(storyEl.innerHTML !== stageData[stageIndex].text) {
                storyEl.classList.remove('active');
                setTimeout(() => {
                    storyEl.innerHTML = stageData[stageIndex].text;
                    chapterEl.innerHTML = stageData[stageIndex].title;
                    storyEl.classList.add('active');
                }, 1000);
            }
        }
        storyEl.classList.add('active');

        // --- MAIN RENDER LOOP ---
        function loop() {
            globalTimeline += 16.66;
            
            let elapsed = globalTimeline;
            let cumulativeTime = 0;
            let targetStage = 0;
            for(let i=0; i<stageData.length; i++) {
                cumulativeTime += stageData[i].duration;
                if(elapsed < cumulativeTime) { targetStage = i; break; }
                if(i === stageData.length - 1) targetStage = stageData.length - 1;
            }
            if(targetStage !== currentStage) currentStage = targetStage;
            updateText(currentStage);

            bike.baseX = canvas.width * 0.35;
            bike.baseY = canvas.height * 0.68;
            
            let cameraScale = 1.0;
            if(currentStage === STAGES.MOUNTAINS) cameraScale = 0.9;
            if(currentStage === STAGES.FINAL_HILLTOP) cameraScale = 0.8;

            bike.wheelRotation += 0.35;
            // Realistic suspension micro-bobbing
            bike.bobbing = (Math.sin(globalTimeline * 0.04) * 1.5) + (Math.sin(globalTimeline * 0.1) * 0.5);
            
            bike.x += (bike.baseX - bike.x) * 0.05;
            if (currentStage === STAGES.FINAL_HILLTOP) {
                bike.y += ((canvas.height * 0.65) - bike.y) * 0.03;
            } else {
                bike.y += ((bike.baseY + bike.bobbing) - bike.y) * 0.15;
            }

            ctx.fillStyle = '#050505';
            ctx.fillRect(0,0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(cameraScale, cameraScale);
            ctx.translate(-canvas.width/2, -canvas.height/2);

            drawBackgrounds(currentStage);
            drawEnvironmentForeground(currentStage);
            
            // Render the highly detailed programmatic photoreal models
            drawRealisticPhotorealisticModels();
            
            drawWeatherEffects(currentStage);
            ctx.restore();
            requestAnimationFrame(loop);
        }

        // --- BACKGROUND & ENVIRONMENT RENDERERS ---
        function drawBackgrounds(stage) {
            let width = canvas.width; let height = canvas.height;
            let grad = ctx.createLinearGradient(0, 0, 0, height);

            if(stage === STAGES.SUNRISE) {
                grad.addColorStop(0, '#2c3e50'); grad.addColorStop(0.5, '#e74c3c'); grad.addColorStop(1, '#f1c40f');
                ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.shadowBlur = 150; ctx.shadowColor = "#ffeb3b";
                ctx.beginPath(); ctx.arc(width * 0.8, height * 0.4, 90, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            }
            else if(stage === STAGES.STARRY_NIGHT || stage === STAGES.FINAL_HILLTOP) {
                grad.addColorStop(0, '#02010a'); grad.addColorStop(1, '#0b132b');
                ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
                ctx.fillStyle = "#ffffff";
                stars.forEach(s => {
                    ctx.globalAlpha = Math.abs(Math.sin(globalTimeline*0.001 + s.alpha));
                    ctx.fillRect(s.x % width, s.y % (height*0.6), s.size, s.size);
                });
                ctx.globalAlpha = 1.0;
                let mx = width * 0.8; let my = height * 0.25;
                let moonGlow = ctx.createRadialGradient(mx, my, 60, mx, my, 200);
                moonGlow.addColorStop(0, "rgba(255, 255, 255, 1)"); moonGlow.addColorStop(0.3, "rgba(200, 220, 255, 0.6)"); moonGlow.addColorStop(1, "transparent");
                ctx.fillStyle = moonGlow; ctx.beginPath(); ctx.arc(mx, my, 200, 0, Math.PI*2); ctx.fill();
            }
            else if(stage === STAGES.RAINSTORM) {
                grad.addColorStop(0, '#1c1f24'); grad.addColorStop(1, '#2c3e50');
                ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
            }
            else {
                grad.addColorStop(0, '#0f2027'); grad.addColorStop(0.5, '#203a43'); grad.addColorStop(1, '#2c5364');
                ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);
            }
        }

        function drawEnvironmentForeground(stage) {
            let width = canvas.width; let height = canvas.height;
            if (stage !== STAGES.FINAL_HILLTOP) {
                let roadTopY = height * 0.74;
                let roadGrad = ctx.createLinearGradient(0, roadTopY, 0, height);
                roadGrad.addColorStop(0, '#1a1c1d'); roadGrad.addColorStop(1, '#0a0a0c'); // Realistic asphalt
                ctx.fillStyle = roadGrad; ctx.fillRect(0, roadTopY, width, height - roadTopY);
                
                // Realistic motion-blurred road lines
                ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
                let speedLineShift = (globalTimeline * 3.0) % 250;
                for (let x = -250; x < width + 250; x += 250) {
                    ctx.fillRect(x - speedLineShift, roadTopY + 40, 120, 4);
                }
            } else {
                ctx.fillStyle = "#0a0c10"; // Dark dirt/grass edge
                ctx.beginPath(); ctx.moveTo(0, height); ctx.lineTo(width * 0.1, height * 0.85);
                ctx.ellipse(width * 0.45, height * 0.85, width * 0.5, 120, 0, Math.PI, 0, false);
                ctx.lineTo(width, height); ctx.closePath(); ctx.fill();
            }
        }

        function drawWeatherEffects(stage) {
            let width = canvas.width; let height = canvas.height;
            if (stage === STAGES.RAINSTORM) {
                ctx.strokeStyle = "rgba(200, 220, 255, 0.4)"; ctx.lineWidth = 1.5;
                for(let i=0; i<40; i++) rainDrops.push({ x: Math.random() * width, y: -30, len: Math.random() * 40 + 20, speed: Math.random() * 20 + 20 });
                for(let i=rainDrops.length-1; i>=0; i--) {
                    let r = rainDrops[i]; r.y += r.speed; r.x -= 6;
                    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 5, r.y + r.len); ctx.stroke();
                    if(r.y > height) rainDrops.splice(i, 1);
                }
            }
        }

        // =========================================================================
        // REALISTIC RENDERING ENGINE (Gradients, Proportions, Skin Tones, Shading)
        // =========================================================================
        function drawRealisticPhotorealisticModels() {
            let bx = bike.x;
            let by = bike.y;

            // --- REALISTIC HEADLIGHT CAST ---
            let lightGrad = ctx.createRadialGradient(bx + 160, by + 5, 5, bx + 700, by + 40, 400);
            lightGrad.addColorStop(0, "rgba(255, 245, 230, 0.9)");
            lightGrad.addColorStop(0.3, "rgba(255, 245, 230, 0.2)");
            lightGrad.addColorStop(1, "transparent");
            ctx.fillStyle = lightGrad;
            ctx.beginPath(); ctx.moveTo(bx + 140, by + 5); ctx.lineTo(bx + 800, by - 120); ctx.lineTo(bx + 800, by + 250); ctx.fill();

            // --- REALISTIC MOTORCYCLE (Classic Indian Cruiser/Enfield style) ---
            
            // 1. Realistic Tires & Rims with Motion Blur
            drawRealisticWheel(bx - 110, by + 50);
            drawRealisticWheel(bx + 110, by + 50);

            // 2. Chrome Exhaust System
            let exhaustGrad = ctx.createLinearGradient(bx - 120, by + 35, bx + 50, by + 15);
            exhaustGrad.addColorStop(0, "#888"); exhaustGrad.addColorStop(0.3, "#fff"); exhaustGrad.addColorStop(0.7, "#444"); exhaustGrad.addColorStop(1, "#aaa");
            ctx.fillStyle = exhaustGrad;
            ctx.beginPath(); ctx.moveTo(bx - 130, by + 35); ctx.lineTo(bx + 20, by + 35); ctx.lineTo(bx + 40, by + 15); ctx.lineTo(bx - 110, by + 25); ctx.fill();
            
            // 3. Realistic Engine Block (Metallic fins, shadows)
            let engineGrad = ctx.createLinearGradient(bx - 40, by - 10, bx + 30, by + 40);
            engineGrad.addColorStop(0, "#b0b0b0"); engineGrad.addColorStop(0.5, "#5a5a5a"); engineGrad.addColorStop(1, "#222");
            ctx.fillStyle = engineGrad;
            ctx.fillRect(bx - 35, by - 5, 60, 45); // Main block
            // Engine Fins
            ctx.fillStyle = "#111";
            for(let i=0; i<5; i++) ctx.fillRect(bx - 35, by + i*8, 60, 3);

            // 4. Glossy Paint Fuel Tank (Classic Deep Red with Chrome Trim)
            let tankGrad = ctx.createRadialGradient(bx + 10, by - 25, 5, bx + 10, by - 15, 60);
            tankGrad.addColorStop(0, "#ff4040"); tankGrad.addColorStop(0.5, "#990000"); tankGrad.addColorStop(1, "#330000");
            ctx.fillStyle = tankGrad;
            ctx.beginPath();
            ctx.moveTo(bx - 50, by - 5);
            ctx.bezierCurveTo(bx - 30, by - 35, bx + 50, by - 35, bx + 70, by - 10);
            ctx.lineTo(bx + 40, by + 10);
            ctx.lineTo(bx - 40, by + 10);
            ctx.closePath(); ctx.fill();
            
            // Tank Highlight (Realistic Gloss)
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.ellipse(bx + 10, by - 26, 25, 6, 0, 0, Math.PI*2); ctx.fill();

            // 5. Leather Seat (Textured Matte Black)
            let seatGrad = ctx.createLinearGradient(bx - 110, by - 10, bx - 30, by + 5);
            seatGrad.addColorStop(0, "#1a1a1a"); seatGrad.addColorStop(0.5, "#2a2a2a"); seatGrad.addColorStop(1, "#111");
            ctx.fillStyle = seatGrad;
            ctx.beginPath(); ctx.moveTo(bx - 100, by - 10); ctx.lineTo(bx - 45, by - 10); ctx.lineTo(bx - 35, by - 2); ctx.lineTo(bx - 100, by + 2); ctx.fill();

            // 6. Chrome Front Forks & Headlight Bucket
            ctx.fillStyle = exhaustGrad; // Reuse chrome
            ctx.beginPath(); ctx.moveTo(bx + 110, by + 50); ctx.lineTo(bx + 75, by - 30); ctx.lineTo(bx + 85, by - 35); ctx.lineTo(bx + 120, by + 45); ctx.fill();
            // Headlight casing
            ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(bx + 130, by - 10, 18, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(bx + 140, by - 10, 14, 0, Math.PI*2); ctx.fill();

            // =========================================================================
            // REALISTIC HUMANS (Skin tones, Fabric Shading, Anatomical Proportions)
            // =========================================================================
            let windWave = Math.sin(globalTimeline * 0.04) * 3;
            
            // Color Palettes
            const skinTone = "#8D5A3B";      // Warm Brown Tamil skin tone base
            const skinShadow = "#5A341E";    // Skin shadow
            const skinHighlight = "#A97554"; // Skin highlight

            // --- MALE RIDER ---
            let mx = bx + 10;
            let my = by - 35;

            // Male Legs (Jeans Texture)
            let denimGrad = ctx.createLinearGradient(mx - 20, my + 10, mx + 10, my + 60);
            denimGrad.addColorStop(0, "#2c3e50"); denimGrad.addColorStop(1, "#1a252f");
            ctx.fillStyle = denimGrad;
            ctx.beginPath(); ctx.moveTo(mx - 20, my + 10); ctx.lineTo(mx + 10, my + 10); ctx.lineTo(mx + 30, by + 30); ctx.lineTo(mx + 5, by + 30); ctx.fill();

            // Male Torso (Classic White Button-up Shirt with realistic fabric shading)
            let shirtGrad = ctx.createLinearGradient(mx - 30, my - 40, mx + 20, my + 10);
            shirtGrad.addColorStop(0, "#ffffff"); shirtGrad.addColorStop(0.7, "#d5d5d5"); shirtGrad.addColorStop(1, "#999999");
            ctx.fillStyle = shirtGrad;
            ctx.beginPath(); ctx.moveTo(mx - 30, my + 20); ctx.lineTo(mx - 15, my - 40); ctx.lineTo(mx + 20, my - 30); ctx.lineTo(mx + 15, my + 20); ctx.fill();
            
            // Fabric creases
            ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(mx - 5, my - 30); ctx.lineTo(mx - 15, my + 10); ctx.stroke();

            // Male Arm (Skin tone exposed forearm & rolled up sleeve)
            let armGrad = ctx.createLinearGradient(mx - 10, my - 30, bx + 75, by - 35);
            armGrad.addColorStop(0, skinShadow); armGrad.addColorStop(0.5, skinTone); armGrad.addColorStop(1, skinHighlight);
            ctx.strokeStyle = armGrad; ctx.lineWidth = 11; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(mx - 5, my - 30); ctx.lineTo(mx + 20, my - 15); ctx.lineTo(bx + 75, by - 35); ctx.stroke();
            // Rolled sleeve
            ctx.fillStyle = "#e0e0e0"; ctx.beginPath(); ctx.arc(mx + 20, my - 15, 8, 0, Math.PI*2); ctx.fill();

            // Male Head & Hair
            // Neck
            ctx.fillStyle = skinShadow; ctx.fillRect(mx - 2, my - 50, 10, 15);
            // Face profile (Realistic jawline and nose)
            ctx.fillStyle = skinTone;
            ctx.beginPath();
            ctx.moveTo(mx + 3, my - 45); ctx.lineTo(mx + 15, my - 42); // Jaw
            ctx.lineTo(mx + 18, my - 55); ctx.lineTo(mx + 22, my - 60); // Nose bump
            ctx.lineTo(mx + 15, my - 70); ctx.lineTo(mx - 5, my - 70); ctx.fill();
            // Hair (Realistic dark brown/black textured layers)
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.moveTo(mx - 8, my - 65); ctx.bezierCurveTo(mx - 15, my - 80, mx + 20, my - 85, mx + 15, my - 65); ctx.fill();

            // --- FEMALE RIDER ---
            let wx = mx - 35;
            let wy = my + 10;

            // Female Saree Flow (Realistic Silk Material Gradient)
            let silkGrad = ctx.createLinearGradient(wx, wy, wx - 180, wy + 40);
            silkGrad.addColorStop(0, "#800020"); // Deep Burgundy
            silkGrad.addColorStop(0.5, "#C71585"); // Silk sheen highlight
            silkGrad.addColorStop(1, "#4A0010");
            ctx.fillStyle = silkGrad;
            
            // Dynamic Billowing Fabric
            ctx.beginPath();
            ctx.moveTo(wx - 10, wy + 15);
            ctx.bezierCurveTo(wx - 80 + windWave*2, wy - 5, wx - 150 + windWave*3, wy + 50, wx - 220, wy + 20 + windWave);
            ctx.bezierCurveTo(wx - 140, wy + 80, wx - 60, wy + 60, wx + 5, wy + 25);
            ctx.fill();
            
            // Saree Gold Zari Border
            ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(wx - 10, wy + 15);
            ctx.bezierCurveTo(wx - 80 + windWave*2, wy - 5, wx - 150 + windWave*3, wy + 50, wx - 220, wy + 20 + windWave);
            ctx.stroke();

            // Female Torso (Saree Blouse)
            ctx.fillStyle = "#2b0000";
            ctx.beginPath(); ctx.moveTo(wx - 25, wy + 20); ctx.lineTo(wx - 10, wy - 30); ctx.lineTo(wx + 20, wy - 20); ctx.lineTo(wx + 5, wy + 25); ctx.fill();

            // Female Bare Midriff (Skin tone peeking through saree draping)
            ctx.fillStyle = skinTone;
            ctx.beginPath(); ctx.moveTo(wx - 20, wy + 10); ctx.lineTo(wx - 10, wy - 5); ctx.lineTo(wx + 15, wy); ctx.lineTo(wx + 5, wy + 15); ctx.fill();

            // Female Arm Wrapping Around
            ctx.strokeStyle = armGrad; // Use same skin gradient setup
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(wx - 5, wy - 25); ctx.lineTo(wx + 30, wy - 15); ctx.lineTo(mx - 5, my + 15); ctx.stroke();
            
            // Gold Bangles on wrist
            ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 2;
            for(let b=0; b<4; b++) { ctx.beginPath(); ctx.moveTo(mx - 10 - b*2, my + 10 + b); ctx.lineTo(mx - 5 - b*2, my + 15 + b); ctx.stroke(); }

            // Female Head & Flowing Hair
            ctx.fillStyle = skinTone;
            ctx.beginPath(); ctx.arc(wx + 10, wy - 45, 12, 0, Math.PI*2); ctx.fill(); // Head
            
            // Realistic Hair Flow (Rich dark brown/black with specular sheen)
            let hairGrad = ctx.createLinearGradient(wx, wy - 50, wx - 150, wy - 20);
            hairGrad.addColorStop(0, "#0a0a0a"); hairGrad.addColorStop(0.5, "#2a1b15"); hairGrad.addColorStop(1, "transparent");
            ctx.fillStyle = hairGrad;
            
            ctx.beginPath();
            ctx.moveTo(wx + 15, wy - 55);
            ctx.bezierCurveTo(wx - 40 + windWave*2, wy - 60, wx - 100 + windWave*3, wy - 10, wx - 160, wy - 15 + windWave);
            ctx.bezierCurveTo(wx - 90, wy + 10, wx - 40, wy - 30, wx + 5, wy - 40);
            ctx.fill();
        }

        // =========================================================================
        // REALISTIC WHEEL RENDERING (Rubber textures, Brake Discs, Spokes)
        // =========================================================================
        function drawRealisticWheel(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(bike.wheelRotation);

            // Realistic Rubber Tire (Dark grey/black gradient)
            let tireGrad = ctx.createRadialGradient(0,0, 35, 0,0, 48);
            tireGrad.addColorStop(0, "#111"); tireGrad.addColorStop(0.5, "#2a2a2a"); tireGrad.addColorStop(1, "#050505");
            ctx.fillStyle = tireGrad;
            ctx.beginPath(); ctx.arc(0, 0, 46, 0, Math.PI*2); ctx.fill();
            
            // Chrome Wheel Rim
            ctx.strokeStyle = "#d4d4d4"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI*2); ctx.stroke();

            // Brake Rotor Disc (Metallic ring with drill holes)
            ctx.strokeStyle = "#888"; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = "#000";
            for(let d=0; d<8; d++) {
                ctx.beginPath(); ctx.arc(Math.cos(d*Math.PI/4)*18, Math.sin(d*Math.PI/4)*18, 1.5, 0, Math.PI*2); ctx.fill();
            }

            // Fine Wire Spokes (Classic Motorcycle style)
            ctx.strokeStyle = "#999"; ctx.lineWidth = 1;
            for (let s = 0; s < 18; s++) {
                ctx.rotate(Math.PI / 9);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 35); ctx.stroke();
            }

            // Central Axle
            ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        loop();
    </script>
